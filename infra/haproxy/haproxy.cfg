global
    log stdout format raw local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout tunnel 1h
    default-server inter 2s fall 2 rise 2

frontend public
    bind :80
    use_backend api if { path_beg /api/ }
    default_backend front

frontend internal
    bind :8000
    default_backend api

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends

backend front
    balance roundrobin
    cookie SHOP_FRONT insert indirect nocache
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    server front 10.10.1.11:8080 check cookie front

backend api
    balance roundrobin
    http-request replace-path ^/api(/.*)$ \1
    option httpchk
    http-check send meth GET uri /live
    http-check expect status 200
    server api 10.10.2.21:8000 check
